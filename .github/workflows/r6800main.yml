name: Build MT7621 NETGEAR-BZV (fightroad-KVR)

on: 
  repository_dispatch:
  workflow_dispatch:

env:
  TNAME: "NETGEAR-BZV"

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
        fakeroot kmod cpio git python3-docutils gettext automake autopoint \
        texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
        libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin
        
        sudo mkdir -p /mnt/opt
        sudo chown $USER:$USER /mnt/opt

    - name: Clone source code
      run: |
        mkdir -p /mnt/opt/rt-n56u
        sudo rm -rf /opt/rt-n56u
        ln -s /mnt/opt/rt-n56u /opt/rt-n56u
        
        git clone --depth=1 --single-branch https://github.com/vb1980/Padavan-KVR.git /opt/rt-n56u
        sed -i 's/192.168.2/192.168.6/g' /opt/rt-n56u/trunk/user/shared/defaults.h
        sed -i 's/ntp1.aliyun.com/time.pool.aliyun.com/g' /opt/rt-n56u/trunk/user/shared/defaults.h
        
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/

    - name: Build Firmware
      run: |
        echo "FILE_DATE=-$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

        ################################################################################################
        # 加载配置文件
        ################################################################################################
        CONFIG_SRC=""
        if [ -f "$GITHUB_WORKSPACE/$TNAME/$TNAME.config" ]; then
          CONFIG_SRC="$GITHUB_WORKSPACE/$TNAME/$TNAME.config"
        elif [ -f "/opt/rt-n56u/trunk/configs/templates/$TNAME.config" ]; then
          CONFIG_SRC="/opt/rt-n56u/trunk/configs/templates/$TNAME.config"
        fi
        if [ -z "$CONFIG_SRC" ]; then
          echo "ERROR: No config found for $TNAME."
          exit 1
        fi
        echo "Using config: $CONFIG_SRC"
        cp -vpf "$CONFIG_SRC" /opt/rt-n56u/trunk/.config

        cd /opt/rt-n56u/trunk

        ################################################################################################
        # 超频 1000MHz：把 init.c 中的 0xc2 精确替换为 0x312
        # 说明：这个 fork 的 PLL 值写的是 0xc2（不是原版 0x2B2），
        #       fbdiv = ((reg>>4)&0x7F)+1，0x312 对应 fbdiv=50 → 50*20=1000MHz
        ################################################################################################
        INIT_C="linux-3.4.x/arch/mips/rt2880/init.c"
        if [ -f "$INIT_C" ]; then
          echo "=== Lines 545-565 of $INIT_C (before) ==="
          sed -n '545,565p' "$INIT_C" || true

          # 精确匹配带括号/比较符的 0xc2，避免误伤其他十六进制数
          sed -i 's/!= 0xc2)/!= 0x312)/g' "$INIT_C"
          sed -i 's/(0xc2);/(0x312);/g' "$INIT_C"
          # 兜底：大小写变体与宽松写法
          sed -i 's/0xC2/0x312/g' "$INIT_C"

          echo "=== Lines 545-565 of $INIT_C (after) ==="
          sed -n '545,565p' "$INIT_C" || true

          echo "=== grep 0x312 in $INIT_C ==="
          grep -n "0x312" "$INIT_C" || echo "(WARNING: 0x312 not found, check lines above manually)"
        else
          echo "ERROR: $INIT_C not found."
          exit 1
        fi

        ################################################################################################
        # 修复 .config 中的超频开关（必须先删除被注释的行，再写入不带 # 的开关）
        ################################################################################################
        sed -i '/CONFIG_FIRMWARE_CPU_900MHZ/d' .config
        sed -i '/CONFIG_FIRMWARE_MT7621_OC/d' .config
        echo "CONFIG_FIRMWARE_CPU_900MHZ=y" >> .config
        echo 'CONFIG_FIRMWARE_MT7621_OC="0x312"' >> .config

        ################################################################################################
        # 清理所有可选插件（"其它全部不要"）
        ################################################################################################
        for opt in SHADOWSOCKS V2RAY TROJAN SSOBFS XRAY SRELAY \
                   ADBYBY KOOLPROXY ADGUARDHOME DNSFORWARDER \
                   ZEROTIER ALIDDNS DDNSTO \
                   MENTOHUST SCUTCLIENT GDUT_DRCOM DOGCOM MINIEAP NJIT_CLIENT \
                   TRANSMISSION TRANSMISSION_WEB_CONTROL ARIA ARIA_WEB_CONTROL \
                   MINIDLNA XUPNPD FIREFLY CADDY CADDYBIN WYY WYYBIN \
                   OPENVPN SSWAN SOFTETHERVPN_SERVER SOFTETHERVPN_CLIENT SOFTETHERVPN_CMD \
                   VLMCSD TTYD LRZSZ HTOP NANO IPERF3 MTR SOCAT \
                   SMBD SMBD36 WINS SMBD_SYSLOG FTPD LPRD U2EC \
                   EAP_PEAP SFTP TCPDUMP HDPARM PARTED CURL \
                   XFRM QOS IMQ IFB IPSET SFE \
                   NFSD NFSC CIFS NAPT66 \
                   XFS FUSE SWAP HID AUDIO UVC SERIAL \
                   DROPBEAR DROPBEAR_FAST_CODE RPL2TP DUMP1090 RTL_SDR \
                   FRPC FRPS TUNSAFE; do
          sed -i "/CONFIG_FIRMWARE_INCLUDE_${opt}=/d" .config
          sed -i "/CONFIG_FIRMWARE_ENABLE_${opt}=/d" .config
        done

        ################################################################################################
        # 显式开启需要保留的功能
        ################################################################################################
        # KVR（V 选项是 WNM）
        echo "CONFIG_RT_DOT11K_RRM=y" >> .config
        echo "CONFIG_RT_DOT11R_FT=y" >> .config
        echo "CONFIG_RT_DOT11V_WNM=y" >> .config

        # SmartDNS
        echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNS=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNSBIN=y" >> .config

        # 中文界面
        echo "CONFIG_FIRMWARE_INCLUDE_LANG_CN=y" >> .config

        # USB 基础与文件系统
        echo "CONFIG_FIRMWARE_ENABLE_USB=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_UFSD=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_FAT=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_EXT4=y" >> .config

        # USB 网卡 (USB-over-IP)
        echo "CONFIG_FIRMWARE_INCLUDE_USBIP=y" >> .config

        # 基础访问功能
        echo "CONFIG_FIRMWARE_INCLUDE_HTTPS=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_OPENSSH=y" >> .config

        echo "=== Final .config (relevant lines) ==="
        grep -E "CPU_900|MT7621_OC|RT_DOT11|SMARTDNS|LANG_CN|USB|OPENSSH|HTTPS" .config || true

        ################################################################################################
        # 关键修复：设置 PTHREAD_CFLAGS，解决 e2fsprogs 编译错误
        ################################################################################################
        export PTHREAD_CFLAGS="-pthread"
        echo "PTHREAD_CFLAGS is set to: $PTHREAD_CFLAGS"

        ./clear_tree_simple
        fakeroot ./build_firmware_modify $TNAME 0
        mv -f images/*.trx /opt/images
        cp -vpf .config /opt/images

    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: Padavan-MT7621-${{ env.TNAME }}-C${{ env.FILE_DATE }}
        path: /opt/images
